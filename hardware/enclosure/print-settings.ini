# PrusaSlicer print settings. Keep the supplied STL orientation.
# Select the real printer and its PETG filament preset before making print G-code.
# 300 x 300 mm bed recommended; require model plus 5 mm brim on each side.
layer_height = 0.2
first_layer_height = 0.2
extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeters = 5
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 25%
fill_pattern = gyroid
perimeter_generator = arachne
support_material = 0
brim_width = 5
brim_separation = 0.15
perimeter_speed = 35
external_perimeter_speed = 25
infill_speed = 50
bridge_speed = 20
first_layer_speed = 20
# Reduce the first-layer bulge at mating edges; verify with the fit samples.
elefant_foot_compensation = 0.15
