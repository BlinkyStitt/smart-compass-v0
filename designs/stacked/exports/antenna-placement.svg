<ns0:text x="24" y="620" font-size="13">Form riser and bend before soldering into ANT.</ns0:text>
<ns0:text x="370" y="95" font-size="14">Cut 78 mm TOTAL; includes 2 mm stripped end.</ns0:text>
<ns0:text x="370" y="121" font-size="14">ANT XYZ: (68.636, -7.094, 8) mm.</ns0:text>
<ns0:text x="370" y="147" font-size="14">Feed rises 16 mm; bend radius 3 mm.</ns0:text>
<ns0:text x="370" y="173" font-size="14">Straight after bend: 60.288 mm at Z24.</ns0:text>
<ns0:text x="370" y="199" font-size="14">Tip XYZ: (68.636, 56.194, 24).</ns0:text>
<ns0:text x="370" y="225" font-size="14">Wire OD 1; placement tolerance ±0.2 mm.</ns0:text>
<ns0:text x="370" y="251" font-size="14">Tie saddles locate the run; release ties before radio removal.</ns0:text>
<ns0:text x="370" y="277" font-size="14">Gap values below include insulation + placement tolerance:</ns0:text>
<ns0:text x="370" y="303" font-size="14">RadioShelf: 0.80 mm</ns0:text>
<ns0:text x="370" y="329" font-size="14">ElectronicsShell: 1.30 mm</ns0:text>
<ns0:text x="370" y="355" font-size="14">Radio: 2.50 mm</ns0:text>
<ns0:text x="370" y="381" font-size="14">FibonacciPCB: 3.30 mm</ns0:text>
<ns0:text x="370" y="407" font-size="14">Side0Strip: 3.76 mm</ns0:text>
<ns0:text x="370" y="433" font-size="14">Side1Strip: 3.76 mm</ns0:text>
<ns0:text x="370" y="459" font-size="14">SparkleMotion: 4.63 mm</ns0:text>
<ns0:text x="370" y="485" font-size="14">Side0LEDs: 4.70 mm</ns0:text>
<ns0:text x="370" y="511" font-size="14">Feed pad / saddle contacts are bounded exceptions.</ns0:text>
<ns0:text x="370" y="537" font-size="14">CAD checks do not establish RF range or installed tuning.</ns0:text>
