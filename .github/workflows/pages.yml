name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg git-lfs
      - name: Fetch site media from Git LFS
        run: >-
          git lfs pull --include='hardware/enclosure/exports/infinity-rainbow*.mp4,designs/stacked/exports/infinity-rainbow.mp4,designs/stacked/exports/night-side.png,site/assets/size-comparison.png,site/assets/exploded-assembly.mp4,site/assets/wide-worn.png,site/assets/narrow-worn.png,site/assets/narrow-silver.mp4'
      - name: Build and verify site media
        run: |
          python3 -m unittest discover -s site -p 'test_*.py' -v
          python3 site/build.py --output "$RUNNER_TEMP/compass-pages"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/compass-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  notify:
    name: Notify deployment result
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish deployment notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if ! LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha); then
            echo '::warning::Could not check current master; notification was skipped.'
            echo 'Notification skipped: could not check current master.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export LATEST_SHA
          python3 site/deploy_notification.py
