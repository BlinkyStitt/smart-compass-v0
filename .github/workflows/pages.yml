name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg git-lfs
      - name: Fetch site media from Git LFS
        run: >-
          git lfs pull --include='hardware/enclosure/exports/infinity-rainbow*.mp4,designs/stacked/exports/infinity-rainbow*.mp4,designs/stacked/exports/night-side.png,site/assets/size-comparison.png,site/assets/exploded-assembly.mp4,site/assets/wide-worn.png,site/assets/narrow-worn.png,site/assets/narrow-silver.mp4'
      - name: Build and verify site media
        run: |
          python3 -m unittest discover -s site -p 'test_*.py' -v
          python3 site/build.py --output "$RUNNER_TEMP/compass-pages"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/compass-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Notify ntfy of successful deployment
        if: ${{ success() && steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from contextlib import suppress
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def notify():
              required = ("NTFY_URL", "NTFY_TOPIC", "NTFY_TOKEN", "DEPLOYMENT_URL")
              if any(not os.environ.get(key, "").strip() for key in required):
                  return "Skipped: notification configuration is missing."
              try:
                  repository = os.environ["GITHUB_REPOSITORY"]
                  base = f'{os.environ["GITHUB_SERVER_URL"]}/{repository}'
                  commit = f'{base}/commit/{os.environ["GITHUB_SHA"]}'
                  run = (f'{base}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
                         f'/attempts/{os.environ["GITHUB_RUN_ATTEMPT"]}')
                  website = os.environ["DEPLOYMENT_URL"]
                  payload = {
                      "topic": os.environ["NTFY_TOPIC"],
                      "title": "Smart Compass deployed",
                      "priority": 3,
                      "tags": ["white_check_mark"],
                      "click": website,
                      "message": (f'{repository} deployed successfully.\n'
                                  f'Commit: {commit}\nWebsite: {website}\nWorkflow: {run}'),
                  }
                  request = Request(
                      os.environ["NTFY_URL"],
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json",
                               "Authorization": f'Bearer {os.environ["NTFY_TOKEN"]}'},
                      method="POST",
                  )
                  # Do not follow redirects or retry: one deployment, one request.
                  with build_opener(NoRedirect()).open(request, timeout=15) as response:
                      if not 200 <= response.status < 300:
                          return "Failed: notification service returned an HTTP error."
              except HTTPError as error:
                  with suppress(Exception):
                      error.close()
                  return "Failed: notification service returned an HTTP error."
              except Exception:
                  # Exception details may contain credentials or request/response data.
                  return "Failed: notification configuration or transport error."
              return "Sent: deployment notification accepted by ntfy."

          result = notify()
          if not result.startswith("Sent:"):
              print(f"::warning::ntfy: {result}")
          try:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(f"## Deployment notification\n\n{result}\n")
          except (KeyError, OSError):
              print("::warning::ntfy: Could not write the notification job summary.")
          PY
