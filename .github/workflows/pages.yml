name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ski-kvm-smart-compass-v0
    container:
      image: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
    defaults:
      run:
        shell: bash
    # Allow Ubuntu media and browser packages to finish on a slow mirror.
    timeout-minutes: 40
    steps:
      - name: Install media and checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl ffmpeg git git-lfs python3 unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fetch all native and site inputs from Git LFS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" lfs pull
      - name: Check enclosure and narrow source contracts
        run: |
          python3 -m unittest discover -s hardware/enclosure -p 'test_*.py' -v
          python3 designs/stacked/run.py test
      - name: Check electrical prototype design
        run: python3 hardware/enclosure/electrical.py check
      - name: Install pinned pattern sampler and browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build/browser-cache
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --output "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          npm ci --prefix site --ignore-scripts --no-fund
          node site/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Build and verify site media
        run: |
          python3 -m unittest discover -s site -p 'test_*.py' -v
          python3 site/build.py --output "$RUNNER_TEMP/compass-pages"
          python3 site/verify.py local --directory "$RUNNER_TEMP/compass-pages" --webkit
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/compass-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ski-kvm-smart-compass-v0
    container:
      image: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
    defaults:
      run:
        shell: bash
    # Live verification installs Chromium and its Ubuntu packages.
    timeout-minutes: 30
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install checkout and GitHub CLI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3
          gh_archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --location --retry 3 --output "$gh_archive" https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz
          echo "98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e  $gh_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gh"
          tar --extract --gzip --file "$gh_archive" --directory "$RUNNER_TEMP/gh" --strip-components=2 gh_2.104.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Retrieve the complete reviewed artifact and browser
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build/browser-cache
        run: |
          gh run download "$GITHUB_RUN_ID" --name github-pages --dir "$RUNNER_TEMP/pages-artifact"
          mkdir -p "$RUNNER_TEMP/expected-pages"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/expected-pages"
          npm ci --prefix site --ignore-scripts --no-fund
          node site/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Verify the deployed revision, assets and browser behavior
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 site/verify.py live --url "$PAGE_URL" --expected "$RUNNER_TEMP/expected-pages"
      - name: Notify ntfy of successful deployment
        if: ${{ success() && steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from contextlib import suppress
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def notify():
              required = ("NTFY_URL", "NTFY_TOPIC", "NTFY_TOKEN", "DEPLOYMENT_URL")
              if any(not os.environ.get(key, "").strip() for key in required):
                  return "Skipped: notification configuration is missing."
              try:
                  repository = os.environ["GITHUB_REPOSITORY"]
                  base = f'{os.environ["GITHUB_SERVER_URL"]}/{repository}'
                  commit = f'{base}/commit/{os.environ["GITHUB_SHA"]}'
                  run = (f'{base}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
                         f'/attempts/{os.environ["GITHUB_RUN_ATTEMPT"]}')
                  website = os.environ["DEPLOYMENT_URL"]
                  payload = {
                      "topic": os.environ["NTFY_TOPIC"],
                      "title": "Smart Compass deployed",
                      "priority": 3,
                      "tags": ["white_check_mark"],
                      "click": website,
                      "message": (f'{repository} deployed successfully.\n'
                                  f'Commit: {commit}\nWebsite: {website}\nWorkflow: {run}'),
                  }
                  request = Request(
                      os.environ["NTFY_URL"],
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json",
                               "Authorization": f'Bearer {os.environ["NTFY_TOKEN"]}'},
                      method="POST",
                  )
                  # Do not follow redirects or retry: one deployment, one request.
                  with build_opener(NoRedirect()).open(request, timeout=15) as response:
                      if not 200 <= response.status < 300:
                          return "Failed: notification service returned an HTTP error."
              except HTTPError as error:
                  with suppress(Exception):
                      error.close()
                  return "Failed: notification service returned an HTTP error."
              except Exception:
                  # Exception details may contain credentials or request/response data.
                  return "Failed: notification configuration or transport error."
              return "Sent: deployment notification accepted by ntfy."

          result = notify()
          if not result.startswith("Sent:"):
              print(f"::warning::ntfy: {result}")
          try:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(f"## Deployment notification\n\n{result}\n")
          except (KeyError, OSError):
              print("::warning::ntfy: Could not write the notification job summary.")
          PY
